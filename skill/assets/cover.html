<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦吃饭小搭子 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #FFF6E5;
    background-image:
      radial-gradient(circle at 12% 18%, #FFE9B8 0 18%, transparent 18%),
      radial-gradient(circle at 88% 82%, #FFE0CC 0 16%, transparent 16%);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    color: #4A3520;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 40px 28px 34px;
    background: #FFFDF8;
    border: 2px dashed #E8C79A;
    border-radius: 26px;
    box-shadow: 0 14px 34px rgba(180, 120, 50, .14);
    text-align: center;
    overflow: hidden;
  }

  .tape {
    position: absolute;
    left: -10%;
    width: 120%;
    height: 16px;
    background: repeating-linear-gradient(
      135deg,
      #FFD98A 0 10px,
      #FFCB6B 10px 20px
    );
    opacity: .75;
    animation: march 2.4s linear infinite;
  }
  .tape.top { top: 14px; }
  .tape.bottom { bottom: 14px; }

  @keyframes march {
    from { background-position: 0 0; }
    to   { background-position: 28px 0; }
  }

  .stars {
    margin-top: 12px;
    font-size: 15px;
    letter-spacing: 6px;
    color: #E8A33D;
  }
  .stars span {
    display: inline-block;
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .stars span:nth-child(2n) { animation-delay: .4s; }
  .stars span:nth-child(3n) { animation-delay: .8s; }

  @keyframes twinkle {
    0%, 100% { opacity: .35; transform: scale(.9); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  h1 {
    margin: 22px 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #C7361F;
    text-shadow: 0 2px 0 #FFE2AE;
    animation: float 3.4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .sub {
    font-size: 12px;
    letter-spacing: 3px;
    color: #B08A5E;
    margin-bottom: 24px;
  }

  .belt {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    margin-bottom: 24px;
  }

  .belt .food {
    font-size: 30px;
    display: inline-block;
    animation: hop 1.8s ease-in-out infinite;
  }
  .belt .food:nth-child(1) { animation-delay: 0s; }
  .belt .food:nth-child(2) { animation-delay: .18s; }
  .belt .food:nth-child(3) { animation-delay: .36s; }
  .belt .food:nth-child(4) { animation-delay: .54s; }

  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0) rotate(0); }
    30%           { transform: translateY(-11px) rotate(-6deg); }
  }

  .belt .dot {
    font-size: 13px;
    color: #E0BB8A;
    padding-bottom: 7px;
    animation: slide 1.4s ease-in-out infinite;
  }
  .belt .dot:nth-child(2) { animation-delay: .1s; }
  .belt .dot:nth-child(4) { animation-delay: .3s; }
  .belt .dot:nth-child(6) { animation-delay: .5s; }

  @keyframes slide {
    0%, 100% { opacity: .25; transform: translateX(-3px); }
    50%      { opacity: 1;   transform: translateX(3px); }
  }

  .track {
    position: relative;
    height: 12px;
    background: #FBEFD8;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #FFC93C, #FF8A3D);
    animation: load 2.6s ease-in-out infinite;
  }
  @keyframes load {
    0%   { width: 0; }
    55%  { width: 78%; }
    100% { width: 100%; }
  }

  .hint {
    font-size: 13px;
    letter-spacing: 1px;
    color: #8A6A45;
  }
  .hint .ellipsis::after {
    content: "";
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "·"; }
    50%  { content: "··"; }
    75%  { content: "···"; }
  }

  .menu {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px dashed #EBD3AC;
    display: grid;
    gap: 9px;
    font-size: 14px;
    text-align: left;
    color: #5B4229;
  }
  .menu div {
    padding: 9px 13px;
    background: #FFF8EA;
    border-radius: 12px;
    border-left: 4px solid #FFC93C;
    transition: transform .18s ease;
  }
  .menu div:hover { transform: translateX(4px); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tape top"></div>

    <div class="stars">
      <span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span>
    </div>

    <h1>麦麦吃饭小搭子</h1>
    <div class="sub">麦 当 劳 点 餐 搭 子</div>

    <div class="belt">
      <span class="food">🍔</span>
      <span class="dot">｡o○</span>
      <span class="food">🍟</span>
      <span class="dot">｡o○</span>
      <span class="food">🥤</span>
      <span class="dot">｡o○</span>
      <span class="food">🍦</span>
    </div>

    <div class="track"><div class="fill"></div></div>
    <p class="hint"><span class="ellipsis">正在翻菜单</span></p>

    <div class="menu">
      <div>🥒 今天想当一根薯条　→ 轻一点，瘦一点</div>
      <div>🥔 月底了，麦门低保　→ 省一点，活下去</div>
      <div>🍅 发工资了，朕要奢侈　→ 贵一点，爽一点</div>
      <div>🌶️ 别管我，我自己来　→ 自由一点，随我心意</div>
    </div>

    <div class="tape bottom"></div>
  </div>
</body>
</html>
